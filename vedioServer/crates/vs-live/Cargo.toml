[package]
name = "vs-live"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
vs-auth = { path = "../vs-auth" }
vs-core = { path = "../vs-core" }
vs-tls = { path = "../vs-tls" }
axum.workspace = true
base64 = "=0.22.1"
mime = "=0.3.17"
jsonwebtoken = { version = "=11.1.0", default-features = false }
ring = "=0.17.14"
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }
rustls.workspace = true
subtle.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tower-http.workspace = true
str0m = { version = "=0.25.0", default-features = false }

[target.'cfg(windows)'.dependencies]
str0m = { version = "=0.25.0", default-features = false, features = ["wincrypto"] }

[target.'cfg(not(windows))'.dependencies]
str0m = { version = "=0.25.0", default-features = false, features = ["rust-crypto"] }

[dev-dependencies]
futures-util.workspace = true
tower.workspace = true

[lints]
workspace = true
