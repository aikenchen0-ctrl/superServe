[package]
name = "vs-coordination"
default-run = "vs-coordination"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
vs-core = { path = "../vs-core" }
vs-tls = { path = "../vs-tls" }
vs-auth = { path = "../vs-auth" }
base64 = "=0.22.1"
axum.workspace = true
openraft = { version = "=0.9.25", features = ["serde", "storage-v2"] }
redb = "=2.6.4"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
jsonwebtoken = { version = "=11.1.0", default-features = false }
rustls.workspace = true
hyper = { version = "=1.12.0", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
tower.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile = "3"
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
pem-rfc7468 = { version = "=1.0.0", features = ["alloc"] }
base64 = "=0.22.1"
ring = "=0.17.14"

[lints]
workspace = true
