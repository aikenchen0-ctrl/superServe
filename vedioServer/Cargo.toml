[workspace]
members = ["crates/vs-core", "crates/vs-storage", "crates/vs-service", "crates/vs-live", "crates/vs-auth", "crates/vs-tls", "crates/vs-coordination", "crates/vs-playback-web", "crates/vs-turn"]
resolver = "3"
exclude = ["vendor/turn-server-proto"]

[patch.crates-io]
turn-server-proto = { path = "vendor/turn-server-proto" }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
bytes = "1"
futures-util = "0.3"
http = "1"
http-range = "0.1.5"
opendal = { version = "=0.59.5", default-features = false, features = ["auto-register-services", "executors-tokio", "http-transport-reqwest-rustls-no-provider", "services-fs", "services-s3"] }
opendal-http-transport-reqwest = { version = "=0.59.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync", "fs", "io-util"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
