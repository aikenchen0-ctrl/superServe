[package]
name = "vs-playback-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
license = "MPL-2.0"

[workspace]
members = ["."]
resolver = "3"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
vs-core = { path = "../crates/vs-core" }
thiserror = "=2.0.21"
uniffi = { version = "=0.32.2", default-features = false }

[features]
bindgen = ["uniffi/cli"]

[[bin]]
name = "playback-bindgen"
path = "src/bin/bindgen.rs"
required-features = ["bindgen"]

[profile.dev]
debug = 0

[profile.test]
debug = 0
